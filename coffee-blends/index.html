<!-- 04 — CONTACT FORM -->
<section id="contact-form" class="scroll-mt-24 bg-ck-cream">
    <div class="max-w-7xl mx-auto px-6 lg:px-10 py-16 sm:py-20 lg:py-28 grid lg:grid-cols-12 gap-10 lg:gap-16">
        <div class="lg:col-span-5">
            <p class="rule-index">04</p>
            <p class="eyebrow text-ck-mute mt-3">Get in touch</p>
            <h2 class="font-display text-4xl sm:text-5xl lg:text-6xl leading-[0.95] mt-4">Tell us what you need.</h2>
            <p class="mt-6 text-lg text-ck-mute leading-relaxed">
                Leave your details and a member of the Coffee King team will get back to you to help you find the right products for your business.
            </p>
        </div>

        <form action="https://coffeekingdirect.com/contact#contact_form" method="post" accept-charset="UTF-8"
              class="lg:col-span-7 bg-white border border-ck-coffee/10 p-6 sm:p-8 grid sm:grid-cols-2 gap-5">
            <input type="hidden" name="form_type" value="contact">
            <input type="hidden" name="utf8" value="✓">
            <input type="hidden" name="contact[Source page]" value="Coffee Blends landing">

            <div>
                <label for="cf-name" class="eyebrow text-ck-mute">Name *</label>
                <input id="cf-name" name="contact[name]" type="text" required autocomplete="name"
                       class="mt-2 w-full border border-ck-coffee/20 bg-ck-cream px-4 py-3 focus:outline-none focus:border-ck-orange focus:ring-2 focus:ring-ck-orange/30">
            </div>
            <div>
                <label for="cf-email" class="eyebrow text-ck-mute">Email *</label>
                <input id="cf-email" name="contact[email]" type="email" required autocomplete="email"
                       class="mt-2 w-full border border-ck-coffee/20 bg-ck-cream px-4 py-3 focus:outline-none focus:border-ck-orange focus:ring-2 focus:ring-ck-orange/30">
            </div>
            <div>
                <label for="cf-phone" class="eyebrow text-ck-mute">Phone</label>
                <input id="cf-phone" name="contact[phone]" type="tel" autocomplete="tel"
                       class="mt-2 w-full border border-ck-coffee/20 bg-ck-cream px-4 py-3 focus:outline-none focus:border-ck-orange focus:ring-2 focus:ring-ck-orange/30">
            </div>
            <div>
                <label for="cf-business" class="eyebrow text-ck-mute">Business name</label>
                <input id="cf-business" name="contact[Business name]" type="text" autocomplete="organization"
                       class="mt-2 w-full border border-ck-coffee/20 bg-ck-cream px-4 py-3 focus:outline-none focus:border-ck-orange focus:ring-2 focus:ring-ck-orange/30">
            </div>
            <div class="sm:col-span-2">
                <label for="cf-interest" class="eyebrow text-ck-mute">I'm interested in</label>
                <select id="cf-interest" name="contact[Interested in]"
                        class="mt-2 w-full border border-ck-coffee/20 bg-ck-cream px-4 py-3 focus:outline-none focus:border-ck-orange focus:ring-2 focus:ring-ck-orange/30">
                    <option>Coffee</option>
                    <option>Hot chocolate</option>
                    <option>Coffee machines &amp; equipment</option>
                    <option>Opening a wholesale account</option>
                    <option>Something else</option>
                </select>
            </div>
            <div class="sm:col-span-2">
                <label for="cf-message" class="eyebrow text-ck-mute">Message *</label>
                <textarea id="cf-message" name="contact[body]" rows="5" required
                          class="mt-2 w-full border border-ck-coffee/20 bg-ck-cream px-4 py-3 focus:outline-none focus:border-ck-orange focus:ring-2 focus:ring-ck-orange/30"></textarea>
            </div>
            <div class="sm:col-span-2 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <p class="text-sm text-ck-mute max-w-sm">
                    By sending this form you agree to be contacted by Coffee King about your enquiry. See our
                    <a href="https://coffeekingdirect.com/policies/privacy-policy" class="underline hover:text-ck-orange-2">Privacy Policy</a>.
                </p>
                <button type="submit"
                        class="btn-orange inline-flex items-center justify-center gap-2 w-full sm:w-auto bg-ck-orange text-ck-coffee font-bold uppercase tracking-wide text-sm px-8 py-4">
                    Send message <span aria-hidden="true">↗</span>
                </button>
            </div>
        </form>
    </div>
</section>
